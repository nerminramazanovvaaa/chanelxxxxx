<!DOCTYPE html>

<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğurlu!</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                    url('https://fragmetics.com/cdn/shop/articles/Chanel_Perfumes-5970936-1421239_90db2289-13dd-4f82-a4f9-483399084c5c-4355096.jpg?v=1778061489&width=1536') center/cover no-repeat;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .success-container {
        background: rgba(22, 22, 28, 0.9);
        backdrop-filter: blur(10px);
        padding: 45px 30px;
        border-radius: 16px;
        border: 1px solid rgba(212, 175, 55, 0.5);
        width: 100%;
        max-width: 420px;
        text-align: center;
        color: white;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .checkmark {
        width: 75px;
        height: 75px;
        line-height: 75px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #c9310f;
        color: #000;
        font-size: 42px;
        font-weight: bold;
    }

    h1 {
        color: #cb3009;
        font-size: 28px;
        margin-bottom: 15px;
    }

    p {
        color: #d0d0d0;
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    a {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(45deg, #d4af37, #aa820a);
        color: #000;
        padding: 13px 24px;
        border-radius: 8px;
        font-weight: bold;
        transition: opacity 0.3s;
    }

    a:hover {
        opacity: 0.85;
    }
</style>
```

</head>

<body>

```
<div class="success-container">
    <div class="checkmark">×</div>

    <h1>Təhlükə!</h1>

    <p>
        Məlumatlar uğurla oğurlandı!<br>
        Gələcək səfər bu kimi təkliflərə aldanmayın.
    </p>
</div>
```

</body>
</html>
